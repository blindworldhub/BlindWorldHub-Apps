# Builds Smart Downloader (Android 8 and newer, 32-bit and 64-bit ARM), signs it with the key in this repository's
# secrets, and then uses it for real on Android 8 and Android 15 emulators: the engine gets ready, a shared link is
# found, downloaded as MP4 video and as MP3 audio, and both files are checked in Download/Smart Downloader.
# Nothing secret is in this file: the key and its password come only from the repository's secrets.
name: Smart Downloader

on:
  push:
    branches: [main]
    paths:
      - 'SmartDownloader/**'
      - 'tools/sdsmoke.py'
      - '.github/workflows/smart-downloader.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.14.3'
      - name: Unit tests
        run: gradle -p SmartDownloader --no-daemon testDebugUnitTest
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle -p SmartDownloader --no-daemon assembleRelease -PwithX86 2>&1 | tee build.log
      - name: Sign, and make the phone copy
        shell: bash
        env:
          SD_KEYSTORE_B64: ${{ secrets.SD_KEYSTORE_B64 }}
          SD_STORE_PASSWORD: ${{ secrets.SD_STORE_PASSWORD }}
          SD_KEY_ALIAS: ${{ secrets.SD_KEY_ALIAS }}
        run: |
          set -eo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=SmartDownloader/app/build/outputs/apk/release/app-release-unsigned.apk
          [ -f "$APK" ] || APK=$(ls SmartDownloader/app/build/outputs/apk/release/*.apk | head -1)
          if [ -n "$SD_KEYSTORE_B64" ] && [ -n "$SD_STORE_PASSWORD" ] && [ -n "$SD_KEY_ALIAS" ]; then
            echo "$SD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/key.jks"
            NAME="Smart Downloader.apk"
            echo "SIGNED=1" >> "$GITHUB_ENV"
            echo "Signing with the Smart Downloader key from the secrets."
          else
            export SD_STORE_PASSWORD="test-only-$GITHUB_RUN_ID" SD_KEY_ALIAS=test
            keytool -genkeypair -keystore "$RUNNER_TEMP/key.jks" -storepass "$SD_STORE_PASSWORD" -keypass "$SD_STORE_PASSWORD" \
              -alias test -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Smart Downloader test build" > /dev/null
            NAME="Smart Downloader (test build).apk"
            echo "::warning::The signing key is not in the secrets yet: this is a TEST build with a throwaway key."
          fi
          sign() { "$BT/zipalign" -f -P 16 4 "$1" aligned.apk
                   "$BT/apksigner" sign --ks "$RUNNER_TEMP/key.jks" --ks-key-alias "$SD_KEY_ALIAS" \
                     --ks-pass env:SD_STORE_PASSWORD --key-pass env:SD_STORE_PASSWORD --out "$2" aligned.apk; rm -f aligned.apk; }
          mkdir -p out test
          sign "$APK" test/smartdownloader-test.apk
          cp "$APK" phone.apk
          zip -q -d phone.apk 'lib/x86/*' 'lib/x86_64/*'
          sign phone.apk "out/$NAME"
          rm -f "$RUNNER_TEMP/key.jks" phone.apk
          "$BT/apksigner" verify --print-certs "out/$NAME" | head -3
          "$BT/aapt2" dump badging "out/$NAME" | grep -E "package:|sdkVersion|targetSdkVersion|application-label:|native-code" || true
          for A in arm64-v8a armeabi-v7a; do
            for L in libpython.so libpython.zip.so libqjs.so libffmpeg.so; do unzip -l "out/$NAME" "lib/$A/$L" > /dev/null || { echo "missing lib/$A/$L"; exit 1; }; done
          done
          if unzip -l "out/$NAME" | grep -q "lib/x86"; then echo "x86 parts left in the phone copy"; exit 1; fi
          ls -la out test
      - name: Publish on the Releases page (a pre-release, only when signed with the real key)
        if: env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oP "versionName '\K[^']+" SmartDownloader/app/build.gradle)
          TAG="smart-downloader-$V-build$GITHUB_RUN_NUMBER"
          gh release create "$TAG" "out/Smart Downloader.apk" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Smart Downloader $V (build $GITHUB_RUN_NUMBER)" --notes "Built from $GITHUB_SHA."
      - uses: actions/upload-artifact@v5
        with:
          name: smart-downloader-apk
          path: out/*.apk
          retention-days: 30
      - uses: actions/upload-artifact@v5
        with:
          name: smart-downloader-test-apk
          path: test/smartdownloader-test.apk
          retention-days: 7
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: smart-downloader-build-log
          path: |
            build.log
            SmartDownloader/app/build/outputs/mapping/release/mapping.txt
          retention-days: 7

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            arch: x86
          - api: 35
            arch: x86_64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: smart-downloader-test-apk
          path: test
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: A short test video, served to the emulator
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg > /dev/null
          mkdir -p web
          ffmpeg -loglevel error -f lavfi -i testsrc=size=640x360:rate=25 -f lavfi -i sine=frequency=440 -t 6 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -b:a 128k -shortest web/clip.mp4
          ls -la web
          cd web && nohup python3 -m http.server 8000 > ../http.log 2>&1 &
          sleep 2 && curl -sI http://127.0.0.1:8000/clip.mp4 | head -1
      - name: Use the app on Android API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 tools/sdsmoke.py test/smartdownloader-test.apk results ${{ matrix.api }}
      - name: Keep results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smart-downloader-test-api${{ matrix.api }}
          path: results
          retention-days: 7
